<main><header><h1>政治押题宝典</h1><p>肖8 · 腿8 · 徐10 · 米6　｜　内容来源：小松学长《选择题押题宝典》</p></header>
<div class="bar"><div class="tabs"><button id="bookTab" class="active">全部题目</button><button id="notesTab">积累本 <span id="savedCount">0</span></button></div><div class="tools"><select id="subject" aria-label="科目"><option value="">全部科目</option><option>马原</option><option>毛中特</option><option>新思想</option><option>史纲</option><option>思修</option><option>时政</option></select><select id="order" aria-label="排列顺序"><option value="frequency">考点频次从高到低</option><option value="original">宝典原顺序</option></select><input id="search" type="search" placeholder="搜索题目、考点或题号" aria-label="搜索"></div><div id="status" class="count">正在载入宝典……</div></div>

<script>
'use strict';
const $=id=>document.getElementById(id), KEY='politics-book-2027-collection-v1', SIZE=30;
let all=[],saved={},mode='book',page=0,filtered=[],pending=null,timer,storageFailed=false;
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2600)}
try{const raw=JSON.parse(localStorage.getItem(KEY)||'{}');if(raw&&typeof raw==='object'&&!Array.isArray(raw))saved=Object.fromEntries(Object.entries(raw).filter(([k,v])=>v&&v.id===k&&typeof v.text==='string'))}catch(e){storageFailed=true}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));storageFailed=false;return true}catch(e){storageFailed=true;toast('未能写入浏览器，请立即导出备份。');return false}}
function updateCount(){$('savedCount').textContent=Object.keys(saved).length}
function addQuestion(q){saved[q.id]={...q,kind:'question',created:Date.now()};persist();updateCount()}
function selectQuestion(id,on){if(on)addQuestion(all.find(q=>q.id===id));else{delete saved[id];persist();updateCount()}if(mode==='notes')render();else{const card=document.querySelector('[data-id="'+id+'"]');if(card)card.classList.toggle('chosen',on)}toast(on?'已加入积累本':'已移出积累本')}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

 const text=document.createElement('div');text.className='text';text.textContent=(mode==='notes'?saved[q.id]?.text:null)||q.text;card.append(text);

 if(!filtered.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=mode==='notes'?'积累本还没有匹配内容。勾选题目，或框选正文后按 R。':'没有找到匹配的题目。';$('list').append(empty)}
 $('status').textContent=(mode==='book'?'宝典共 '+all.length+' 题':'积累本共 '+Object.keys(saved).length+' 条')+' · 当前筛选 '+filtered.length+' 条'+(storageFailed?' · 请导出备份':'');$('pageInfo').textContent=(filtered.length?page+1:0)+' / '+Math.ceil(filtered.length/SIZE);$('prev').disabled=page===0;$('next').disabled=(page+1)*SIZE>=filtered.length;$('backup').hidden=mode!=='notes';$('bookTab').classList.toggle('active',mode==='book');$('notesTab').classList.toggle('active',mode==='notes');updateCount()}
function rememberSelection(){const sel=window.getSelection();if(!sel||sel.isCollapsed)return;const node=sel.anchorNode?.parentElement,end=sel.focusNode?.parentElement,startCard=node?.closest('.card'),endCard=end?.closest('.card');if(!startCard||startCard!==endCard||!node.closest('.text')||!end.closest('.text'))return;const q=all.find(q=>q.id===startCard.dataset.id)||saved[startCard.dataset.id];if(q&&sel.toString().trim()){pending={q,text:sel.toString().trim()};$('selectionButton').hidden=false}}

document.addEventListener('mouseup',rememberSelection);document.addEventListener('touchend',rememberSelection);document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.isComposing&&!e.target.closest('input,textarea,select,[contenteditable="true"]')){e.preventDefault();addSelection()}});$('selectionButton').addEventListener('mousedown',e=>e.preventDefault());$('selectionButton').addEventListener('click',addSelection);
$('bookTab').onclick=()=>{mode='book';render(true)};$('notesTab').onclick=()=>{mode='notes';render(true)};for(const id of ['subject','order'])$(id).addEventListener('change',()=>render(true));$('search').addEventListener('input',()=>render(true));$('prev').onclick=()=>{page--;render();window.scrollTo(0,0)};$('next').onclick=()=>{page++;render();window.scrollTo(0,0)};
$('exportJson').onclick=()=>download('政治积累本备份.json',JSON.stringify({version:1,entries:Object.values(saved)},null,2),'application/json;charset=utf-8');$('exportText').onclick=()=>download('政治积累本.txt',Object.values(saved).map(q=>q.subject+'｜'+q.topic+'｜'+q.source+'\n'+q.text).join('\n\n——————\n\n'),'text/plain;charset=utf-8');$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>15000000)throw Error();const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.entries))throw Error();const valid=data.entries.filter(q=>q&&typeof q.id==='string'&&typeof q.text==='string'&&typeof q.subject==='string'&&typeof q.topic==='string'&&typeof q.source==='string'&&Number.isFinite(q.frequency)&&['question','text'].includes(q.kind));if(valid.length!==data.entries.length)throw Error();for(const q of valid)saved[q.id]=q;persist();render();toast('已合并导入 '+valid.length+' 条')}catch(err){toast('导入失败：请选择本页导出的 JSON 备份。')}e.target.value=''};
