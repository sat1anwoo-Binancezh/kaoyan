<style>

*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#202834;font:15px/1.7 "Microsoft YaHei","PingFang SC",sans-serif}header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(10px);border-bottom:1px solid #dbe1e7;padding:12px max(14px,calc((100vw - 1080px)/2))}h1{font-size:21px;line-height:1.4;margin:0 0 9px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,select,input,a.link{font:inherit;font-size:13px;border:1px solid #c9d1dc;background:white;color:#293443;border-radius:6px;padding:7px 10px}button{cursor:pointer}button.active{background:#195f54;border-color:#195f54;color:white}button:disabled{opacity:.4;cursor:default}.spacer{flex:1}a{text-decoration:none}.tip{max-width:1000px;margin:14px auto;padding:0 14px;color:#536171;font-size:13px}#status{font-size:12px;color:#536171}main{max-width:1040px;margin:auto;padding:0 14px 80px}#viewer{position:relative}.page{position:relative;width:100%;background:white;box-shadow:0 1px 7px #14213220;margin:15px 0;isolation:isolate;scroll-margin-top:150px}.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.page .loading{position:absolute;top:45%;width:100%;text-align:center;color:#8c97a4;pointer-events:none}.line{position:absolute;left:5.5%;width:89%;border:0;border-radius:0;padding:0;background:transparent;color:transparent;z-index:2;cursor:crosshair}.line:hover{background:#2779d81c;box-shadow:inset 3px 0 #2779d8}.line.saved{background:#4ba68b1a;box-shadow:inset 3px 0 #398c75}.line.preview{background:#2779d83b;box-shadow:inset 3px 0 #2779d8}.line:focus-visible{outline:2px solid #2779d8;outline-offset:-2px}#viewer.selecting{touch-action:none;user-select:none}#viewer.browsing .line{pointer-events:none}.page-number{position:absolute;right:9px;top:5px;color:#8995a2;font-size:11px;z-index:3;pointer-events:none}#notebook{padding-top:10px}.excerpt{background:white;border:1px solid #dbe1e7;border-radius:9px;margin:15px 0;padding:14px}.excerpt img{display:block;width:100%;height:auto;background:white}.excerpt .actions{display:flex;align-items:center;gap:8px;font-size:12px;color:#5b6878;margin-bottom:10px}.excerpt input{margin-top:10px;width:100%;border:1px solid #d7dde4}.empty{padding:60px 15px;text-align:center;color:#697788}.book-tools{display:flex;gap:8px;align-items:center}.book-tools input{width:58px;text-align:center}.note-tools{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#173f37;color:white;padding:10px 16px;border-radius:8px;z-index:40;max-width:92vw;font-size:14px}.toast button{margin-left:9px;padding:2px 9px}.error{color:#a82525!important}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #347bc8;outline-offset:2px}[hidden]{display:none!important}@media(max-width:600px){header{padding:10px}h1{font-size:18px}.toolbar{gap:6px}button,select,input,a.link{padding:6px 8px;font-size:12px}.spacer{display:none}main{padding-left:5px;padding-right:5px}.tip{padding:0 10px}.page{margin:10px 0}.excerpt{padding:8px}.page{scroll-margin-top:180px}}@media print{header,.tip,.actions,input,.toast{display:none!important}body,main{background:white;margin:0;padding:0;max-width:none}.excerpt{break-inside:avoid;border:0;padding:0;margin:0 0 20px}#viewer{display:none!important}#notebook{display:block!important}}

<header><h1><a class="link" href="./subjective.html" aria-label="切换到主观题" style="display:inline-block;vertical-align:middle;margin-right:9px">⇄ 主观题</a>政治宝典 · 客观题</h1><div class="toolbar"><button id="bookTab" class="active">原 PDF</button><button id="notesTab">积累本 <span id="count">0</span></button><div class="book-tools" id="bookTools"><button id="mode" aria-pressed="true">划选收录</button><select id="toc" aria-label="跳转科目"><option value="1">时政</option><option value="11">马原</option><option value="32">毛中特</option><option value="42">新思想</option><option value="55">史纲</option><option value="66">思修</option></select><input id="pageInput" type="number" min="1" max="72" value="1" aria-label="页码"><span>/72</span><button id="go">跳转</button></div><div class="note-tools" id="noteTools" hidden><button id="export">导出备份</button><button id="import">导入备份</button><button id="print">打印 / 保存PDF</button></div><span class="spacer"></span><a class="link" href="#original-pdf" target="_blank" rel="noopener">打开原PDF</a><span id="status" role="status">正在载入原PDF…</span></div><div class="toolbar" style="margin-top:8px" id="readingTools"><button id="previousPage">上一页</button><button id="nextPage">下一页</button><button id="resumeReading">继续阅读</button><button id="addBookmark">添加当前位置书签</button><button id="openBookmarks">我的书签 <span id="bookmarkCount">0</span></button></div></header>

<p class="tip" id="tip">点击一行收录，再次点击取消这一行；多行摘录取消其中一行时，其余行保留。按住拖动可收录多行及跨页摘录。阅读位置自动记忆；可添加书签随时跳回。触屏浏览可切换“浏览翻页”。</p>
<main><div id="viewer" class="selecting"></div><section id="notebook" hidden></section></main><dialog id="zoom" style="max-width:96vw;width:1100px;max-height:92vh;padding:12px;border:1px solid #bbc7d2;border-radius:9px"><button id="closeZoom" style="position:sticky;top:0;float:right;z-index:1">关闭放大</button><div style="clear:both;overflow:auto;max-height:80vh"><img id="zoomImage" alt="放大的原图摘录" style="display:block;width:auto;max-width:none"></div></dialog><input id="importFile" type="file" accept=".json,application/json" hidden><div id="toast" class="toast" role="status" hidden></div>
